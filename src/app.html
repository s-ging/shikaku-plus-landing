<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="keywords" content="shikaku, puzzle, daily puzzle, logic puzzle, number puzzle" />
		<meta name="author" content="Shikaku+" />
		<meta property="og:locale" content="en_US" />
		<!-- Title, description, Open Graph, Twitter, and canonical are set per-page
		     (see +layout.svelte + each route's <svelte:head>) so they reflect the
		     real domain. Don't hardcode them here — duplicates conflict. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Shippori+Mincho+B1:wght@600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
