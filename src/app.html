<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
		  Domain swap (shikaku-plus-info decision 0024): this landing page serves
		  shikaku.plus and the game lives at play.shikaku.plus. Runs before
		  anything renders, only on https://shikaku.plus/ (not on go.shikaku.plus,
		  not on /blog or other pages):
		  - Help Me! links (?seed=…) and ?support belong to the game: send them on
		    with the query untouched.
		  - A returning player has the old game's data (flutter.* keys) on this
		    origin: send them straight into the game (Krischan, 2026-11-14), and
		    the first time, carry the data along in the URL fragment (#handoff=…,
		    never sent to a server). play.shikaku.plus's web/index.html receives
		    it. The old keys stay here as a backup.
		  - Everyone else (new visitors, crawlers) sees this page.
		-->
		<script>
			(function () {
				try {
					if (location.hostname !== 'shikaku.plus' || location.pathname !== '/') return;
					var q = new URLSearchParams(location.search);
					var appLink = q.has('seed') || q.has('support');
					var ls = window.localStorage;
					var keys = [];
					for (var i = 0; i < ls.length; i++) {
						var k = ls.key(i);
						if (k && k.indexOf('flutter.') === 0) keys.push(k);
					}
					if (!appLink && keys.length === 0) return;
					var hash = '';
					if (keys.length && !ls.getItem('shikaku-handoff-done')) {
						var data = {};
						for (var j = 0; j < keys.length; j++) data[keys[j]] = ls.getItem(keys[j]);
						var packed = encodeURIComponent(JSON.stringify(data));
						// Stay far below browsers' URL limits; past this, skip the handoff.
						if (packed.length < 1500000) {
							hash = '#handoff=' + packed;
							ls.setItem('shikaku-handoff-done', String(Date.now()));
						}
					}
					location.replace('https://play.shikaku.plus/' + location.search + hash);
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="keywords" content="shikaku, puzzle, daily puzzle, logic puzzle, number puzzle" />
		<meta name="author" content="Shikaku+" />
		<meta property="og:locale" content="en_US" />
		<!-- Title, description, Open Graph, Twitter, and canonical are set per-page
		     (see +layout.svelte + each route's <svelte:head>) so they reflect the
		     real domain. Don't hardcode them here — duplicates conflict. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Fonts load without blocking the first paint: the browser fetches the
		     stylesheet early (preload) and applies it once it arrives, showing the
		     fallback fonts from tokens.css until then. This was ~590ms of
		     render-blocking on mobile (PageSpeed, 2026-11-14). Next step: self-host
		     woff2 subsets of the two faces. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Shippori+Mincho+B1:wght@600;700&display=swap"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Shippori+Mincho+B1:wght@600;700&display=swap"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
